services:
  - type: web
    name: peopleprime-hr-copilot
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: PINECONE_INDEX_NAME
        value: peopleprime-hr-kb-384
      - key: PINECONE_NAMESPACE
        value: peopleprime-policies
      - key: PINECONE_CLOUD
        value: aws
      - key: PINECONE_REGION
        value: us-east-1
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: TOP_K
        value: "4"
      - key: MAX_RETRIES
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
